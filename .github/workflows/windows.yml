name: Windows and Linux build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tests/test_upstream_update.py

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match version.json' }
      - name: Build pinned Windows distribution
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Validate changelog release notes
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          ./scripts/release-notes.ps1 -Tag "v$version"
      - name: Launcher tests
        shell: pwsh
        run: node --test tests/launcher.test.mjs
      - name: Windows release signing validation tests
        run: node --test tests/signing.test.mjs
      - name: Case integrity and report tests
        run: node --test tests/triage.test.mjs tests/web.test.mjs
      - name: Bundled web search and opt-in workflow
        run: node tests/web-runtime.mjs
      - name: Offline triage from shipped executable
        run: node tests/triage-runtime.mjs
      - name: Evidence analysis and report workflow
        run: node tests/triage-analysis-smoke.mjs
      - name: Actual runtime and tool smoke test
        shell: pwsh
        run: node tests/runtime-smoke.mjs
      - name: Upload tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-response-windows-x64
          path: |
            dist/pi-response.exe
            dist/pi-response.exe.sha256
            dist/pi-response.exe.build.json
          if-no-files-found: error

  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build pinned Linux distribution
        run: python3 scripts/build-linux.py
      - name: Check Go formatting and launcher tests
        working-directory: src/linux
        run: |
          test -z "$(gofmt -l *.go)"
          go test -v ./...
          go vet ./...
      - name: Linux process and terminal tests
        run: python3 tests/linux-launcher.py
      - name: Case integrity and report tests
        run: node --test tests/triage.test.mjs tests/web.test.mjs
      - name: Bundled web search and opt-in workflow
        run: node tests/web-runtime.mjs
      - name: Offline triage from shipped executable
        run: node tests/triage-runtime.mjs
      - name: Evidence analysis and report workflow
        run: node tests/triage-analysis-smoke.mjs
      - name: Actual Linux runtime and tool smoke test
        run: node tests/runtime-smoke.mjs
      - name: Upload tested Linux release files
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-response-linux-x64
          path: |
            dist/pi-response-linux-x64
            dist/pi-response-linux-x64.sha256
            dist/pi-response-linux-x64.build.json
          if-no-files-found: error

  sign-windows:
    if: startsWith(github.ref, 'refs/tags/') && vars.WINDOWS_SIGNING_MODE == 'azure'
    needs: [updater-tests, build, linux]
    runs-on: windows-2022
    environment: code-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-response-windows-x64
          path: dist
      - name: Validate signing configuration and tested input
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE','SIGNING_SUBJECT')) {
            if ([String]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing configuration: $name" }
          }
          $endpoint = [Uri]$env:SIGNING_ENDPOINT
          if ($endpoint.Scheme -ne 'https' -or -not $endpoint.Host.EndsWith('.codesigning.azure.net') -or $endpoint.UserInfo) { throw 'Invalid Azure signing endpoint' }
          ./scripts/finalize-windows-release.ps1 -Mode Unsigned -ExpectedCommit $env:RELEASE_COMMIT
      - name: Authenticate signing identity with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows launcher
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\pi-response.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify publisher, timestamp, and signed executable
        shell: pwsh
        env:
          SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/finalize-windows-release.ps1 -Mode Signed -ExpectedSubject $env:SIGNING_SUBJECT -ExpectedCommit $env:RELEASE_COMMIT
          ./dist/pi-response.exe --response-info
          if ($LASTEXITCODE -ne 0) { throw 'Signed launcher smoke test failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-response-windows-x64-signed
          path: |
            dist/pi-response.exe
            dist/pi-response.exe.sha256
            dist/pi-response.exe.build.json
          if-no-files-found: error

  release:
    if: >-
      always() && !cancelled() && startsWith(github.ref, 'refs/tags/') &&
      needs.updater-tests.result == 'success' && needs.build.result == 'success' &&
      needs.linux.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    needs: [updater-tests, build, linux, sign-windows]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ vars.WINDOWS_SIGNING_MODE == 'azure' && 'pi-response-windows-x64-signed' || 'pi-response-windows-x64' }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-response-linux-x64
          path: dist
      - name: Enforce release signing policy
        shell: pwsh
        env:
          SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
          SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $mode = if ([String]::IsNullOrEmpty($env:SIGNING_MODE)) { 'unsigned' } else { $env:SIGNING_MODE }
          switch ($mode) {
            'azure' { ./scripts/finalize-windows-release.ps1 -Mode Signed -ExpectedSubject $env:SIGNING_SUBJECT -ExpectedCommit $env:RELEASE_COMMIT }
            { $_ -in @('', 'unsigned') } { ./scripts/finalize-windows-release.ps1 -Mode Unsigned -ExpectedCommit $env:RELEASE_COMMIT }
            default { throw 'Unknown WINDOWS_SIGNING_MODE; refusing publication' }
          }
      - name: Publish tested executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release-notes.ps1 -Tag $env:RELEASE_TAG
          $notes = '.build/release-notes.md'
          $signature = (Get-Content dist/pi-response.exe.build.json -Raw | ConvertFrom-Json).signature
          if ($signature.status -eq 'valid') { Add-Content $notes "`nWindows Authenticode publisher: $($signature.subject). Signature and timestamp verified before publication." }
          else { Add-Content $notes "`nWindows executable: unsigned. Signing is not configured for this release." }
          gh release create $env:RELEASE_TAG dist/pi-response.exe dist/pi-response.exe.sha256 dist/pi-response.exe.build.json dist/pi-response-linux-x64 dist/pi-response-linux-x64.sha256 dist/pi-response-linux-x64.build.json --verify-tag --title "Pi Response $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
