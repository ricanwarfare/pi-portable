name: Windows and Linux build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tests/test_upstream_update.py

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match version.json' }
      - name: Build pinned Windows distribution
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Validate changelog release notes
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          ./scripts/release-notes.ps1 -Tag "v$version"
      - name: Launcher tests
        shell: pwsh
        run: node --test tests/launcher.test.mjs
      - name: Case integrity and report tests
        run: node --test tests/triage.test.mjs tests/web.test.mjs
      - name: Bundled web search and opt-in workflow
        run: node tests/web-runtime.mjs
      - name: Offline triage from shipped executable
        run: node tests/triage-runtime.mjs
      - name: Evidence analysis and report workflow
        run: node tests/triage-analysis-smoke.mjs
      - name: Actual runtime and tool smoke test
        shell: pwsh
        run: node tests/runtime-smoke.mjs
      - name: Upload tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-portable-windows-x64
          path: |
            dist/pi-portable.exe
            dist/pi-portable.exe.sha256
            dist/pi-portable.exe.build.json
          if-no-files-found: error

  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build pinned Linux distribution
        run: python3 scripts/build-linux.py
      - name: Check Go formatting and launcher tests
        working-directory: src/linux
        run: |
          test -z "$(gofmt -l *.go)"
          go test -v ./...
          go vet ./...
      - name: Linux process and terminal tests
        run: python3 tests/linux-launcher.py
      - name: Case integrity and report tests
        run: node --test tests/triage.test.mjs tests/web.test.mjs
      - name: Bundled web search and opt-in workflow
        run: node tests/web-runtime.mjs
      - name: Offline triage from shipped executable
        run: node tests/triage-runtime.mjs
      - name: Evidence analysis and report workflow
        run: node tests/triage-analysis-smoke.mjs
      - name: Actual Linux runtime and tool smoke test
        run: node tests/runtime-smoke.mjs
      - name: Upload tested Linux release files
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-portable-linux-x64
          path: |
            dist/pi-portable-linux-x64
            dist/pi-portable-linux-x64.sha256
            dist/pi-portable-linux-x64.build.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, linux]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-portable-windows-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-portable-linux-x64
          path: dist
      - name: Publish tested executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release-notes.ps1 -Tag $env:RELEASE_TAG
          $notes = '.build/release-notes.md'
          gh release create $env:RELEASE_TAG dist/pi-portable.exe dist/pi-portable.exe.sha256 dist/pi-portable.exe.build.json dist/pi-portable-linux-x64 dist/pi-portable-linux-x64.sha256 dist/pi-portable-linux-x64.build.json --verify-tag --title "Pi Portable $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
